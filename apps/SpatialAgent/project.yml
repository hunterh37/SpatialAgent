name: SpatialAgent
options:
  bundleIdPrefix: io.medvr
  deploymentTarget:
    visionOS: "2.0"
  createIntermediateGroups: true

packages:
  SpatialAgentKit:
    path: ../../packages

targets:
  SpatialAgent:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SpatialAgentKit
        product: AgentKit
      - package: SpatialAgentKit
        product: AgentTransport
      - package: SpatialAgentKit
        product: CharacterKit
      - package: SpatialAgentKit
        product: SceneUnderstanding
      - package: SpatialAgentKit
        product: SpatialMemory
      - package: SpatialAgentKit
        product: HomeBridge
      - package: SpatialAgentKit
        product: DesignSystem
      - package: SpatialAgentKit
        product: VoiceInput
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SpatialAgent
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
        # Without these three, Bonjour browsing silently returns nothing and the
        # ws:// connection is blocked by ATS (docs/architecture.md §2b, §2c).
        NSLocalNetworkUsageDescription: >-
          SpatialAgent connects to the Mac on your network that runs the model. Nothing
          about your home leaves the LAN.
        NSBonjourServices:
          - _spatialagent._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # ARKit plane detection needs this; scene mesh is never transmitted (spec/05-scene.md).
        # Dictation runs on device; without both keys the mic button fails silently.
        NSMicrophoneUsageDescription: >-
          SpatialAgent listens when you hold the mic button so you can speak to the
          character. Audio is transcribed on device.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on device so the character can act on what you say.
        NSWorldSensingUsageDescription: >-
          SpatialAgent uses the shape of your room so the character stands on the floor and
          walks around furniture.
        # Hand tracking is the palm perch (spec/05-scene.md §Hands). Joints stay on device:
        # the only thing derived from them is a landing point.
        NSHandsTrackingUsageDescription: >-
          SpatialAgent watches for an open palm so the character can fly to your hand.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.medvr.SpatialAgent
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "7"
        ENABLE_PREVIEWS: YES

  SpatialAgentUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: UITests
    dependencies:
      - target: SpatialAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.medvr.SpatialAgentUITests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "7"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpatialAgent

schemes:
  SpatialAgent:
    build:
      targets:
        SpatialAgent: all
        SpatialAgentUITests: [test]
    test:
      targets:
        - SpatialAgentUITests
