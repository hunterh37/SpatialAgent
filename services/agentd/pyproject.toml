[project]
name = "agentd"
version = "0.1.0"
description = "SpatialAgent middle layer: agent loop, tool dispatch, model adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "websockets>=13.0",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "jsonschema>=4.23", "ruff>=0.7", "httpx<0.28"]

[project.scripts]
agentd = "agentd.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
